# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-k8s-stack/values.yaml

victoria-metrics-operator:
  enabled: true
  crds:
    enabled: true
    upgrade:
      enabled: false
  operator:
    enable_converter_ownership: true
    disable_prometheus_converter: false
  env:
    - name: VM_ENABLETCP6
      value: "true"

# https://github.com/VictoriaMetrics/helm-charts/issues/3040
syncJob:
  enabled: true
  prune: true
  useOwnerReferences: true
  resourcePrefix: ""
  dnsConfig:
    options:
    - name: ndots
      value: "1"


defaultDashboards:
  enabled: true

defaultRules:
  enabled: true 
  runbookUrl: https://runbooks.prometheus-operator.dev/runbooks

