# https://github.com/dotdc/grafana-dashboards-kubernetes/tree/master#directly-through-the-prometheus-configuration-file-
prometheus-node-exporter:
  hostNetwork: false
  hostPID: false
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: nodename