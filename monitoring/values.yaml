# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
# https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md

defaultRules:
  disabled:
    Watchdog: true

crds:
  enabled: true
  upgradeJob:
    enabled: true

alertmanager:
  alertmanagerSpec:
    storage:
     volumeClaimTemplate:
       spec:
         storageClassName: replicated
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 1Gi

# https://github.com/k3s-io/k3s/issues/3619
kubeControllerManager:
  endpoints:
   - 192.168.142.100
   - 192.168.142.101
   - 192.168.142.102
  service:
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  endpoints:
   - 192.168.142.100
   - 192.168.142.101
   - 192.168.142.102
  service:
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeProxy:
  enabled: true
  endpoints:
   - 192.168.142.100
   - 192.168.142.101
   - 192.168.142.102
  service:

    port: 10249
    targetPort: 10249

kubeEtcd:
  enabled: true
  endpoints:
   - 192.168.142.100
   - 192.168.142.101
   - 192.168.142.102
  service:
    port: 2381
    targetPort: 2381

grafana:
  enabled: true

  dnsConfig:
    options:
    - name: ndots
      value: "1"

  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: authentik-secret
      defaultMode: 0440
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true

  plugins:
    # https://grafana.com/grafana/plugins/camptocamp-prometheus-alertmanager-datasource/
    - camptocamp-prometheus-alertmanager-datasource
    - grafana-piechart-panel

  # https://github.com/grafana/helm-charts/blob/19a40de8f7953a2c1fd13bdfa72eb75e5784559d/charts/grafana/values.yaml#L1305
  # It is missbehaving with auth.generic_oauth.client_secret although the secret is not exposed.
  assertNoLeakedSecrets: false

  grafana.ini:
    analytics:
      check_for_updates: true
    log:
      mode: console
    grafana_net:
      url: https://grafana.net
    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Editor
    server:
      root_url: "https://monitoring.anagno.dev"
    auth:
      signout_redirect_url: "https://auth.anagno.dev/application/o/monitoring/end-session/"
      oauth_auto_login: true
    auth.generic_oauth:
      name: auth.anagno.dev
      auto_sign_up: true
      enabled: true
      # https://github.com/helm/charts/issues/22473#issuecomment-662361020
      client_id: $__file{/etc/secrets/auth_generic_oauth/client_id}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
      scopes: "openid email profile"
      auth_url: "https://auth.anagno.dev/application/o/authorize/"
      token_url: "https://auth.anagno.dev/application/o/token/"
      api_url: "https://auth.anagno.dev/application/o/userinfo/"
      role_attribute_path: contains(groups[*], 'caretakers') && 'Admin' || 'Viewer'
      use_refresh_token: true

  sidecar:
    # For adding dashboards and datasources via ConfigMaps
    dashboards:
      enabled: true
      label: grafana_dashboard
      annotations: 
        monitoring-sidecar-dashboard-directory: "/tmp/dashboards/kubernetes"
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      createPrometheusReplicasDatasources: false
      label: grafana_datasource
      annotations: 
        monitoring-sidecar-datasource-directory: "/tmp/datasource/kubernetes"

  additionalDataSources:
    - name: Prometheus AlertManager
      orgId: 1
      type: camptocamp-prometheus-alertmanager-datasource
      isDefault: false
      url: http://{{ printf "%s-alertmanager" (include "kube-prometheus-stack.fullname" .)  }}:9093
      version: 1

  # https://github.com/dotdc/grafana-dashboards-kubernetes/tree/master#install-with-helm-values
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'grafana-dashboards-kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
  dashboards:
    grafana-dashboards-kubernetes:
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
        token: ''
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
        token: ''

prometheus:
  enabled: true
  service:
    clusterIP: ""
    port: 9090
    externalIPs: []
    type: ClusterIP

  prometheusSpec:
    resources:
      limits:
        memory: 6000Mi

    # https://github.com/rook/rook/issues/6680
    # This was necessary to be able to scrap the data for the Kubernetes/Compute Resources/* databoards
    # We need to be able to scrap the data from all the namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    retention: 30d
    retentionSize: "25GiB"
    walCompression: true
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: replicated
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

prometheusOperator:
  enabled: true
  prometheusConfigReloader:
    # resource config for prometheusConfigReloader
    # The default ones are causing some throttling
    # because the Raspberry pi is not powerfull enough
    resources: {}
  # Enable vertical pod autoscaler support for prometheus-operator
  verticalPodAutoscaler:
    enabled: false

