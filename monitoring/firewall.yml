---
# Enable the firewall and the rules needed for gathering metrics for the monitoring stack.

- name: Prerequisites 
  hosts: masters
  become: yes
  tasks:

  - name: Install ufw
    ansible.builtin.apt:
      name: ufw
      state: present
      update_cache: yes

  - name: UFW - Allow kube manager metrics
    community.general.ufw:
      rule: allow
      port: "10257"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64

  - name: UFW - Allow kube scheduler metrics
    community.general.ufw:
      rule: allow
      port: "10259"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64

  - name: UFW - Allow kube proxy metrics
    community.general.ufw:
      rule: allow
      port: "10249"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64

  - name: UFW - Allow kube etcd metrics
    community.general.ufw:
      rule: allow
      port: "2381"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64


- name: Prerequisites 
  hosts: all
  become: yes
  tasks:

  - name: Install ufw
    ansible.builtin.apt:
      name: ufw
      state: present
      update_cache: yes

  - name: UFW - Allow node exporter metrics
    community.general.ufw:
      rule: allow
      port: "9100"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64

  - name: UFW - Allow kubelet metrics
    community.general.ufw:
      rule: allow
      port: "10250"
      proto: tcp
      from_ip: '{{ item }}'
    loop:
      - 192.168.142.0/24
      - fd93:142::/60
      - 2a02:169:3af:6::/64
      - 2a02:169:3af:7::/64

  - name: UFW - Reload firewall
    ansible.builtin.command: ufw reload