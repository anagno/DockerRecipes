apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring.anagno.dev
  namespace: monitoring
spec:
  commonName: monitoring.anagno.dev
  secretName: monitoring.anagno.dev
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - monitoring.anagno.dev
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: override-headers
  namespace: monitoring
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; frame-ancestors 'none'; img-src https: data:; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring.anagno.dev
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: monitoring.anagno.dev
    external-dns.alpha.kubernetes.io/target: zh.anagno.dev
    kubernetes.io/ingressClassName: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`monitoring.anagno.dev`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
      middlewares:
      - name: override-headers
        namespace: monitoring
      - name: security-headers
        namespace: proxy
  tls:
    secretName: monitoring.anagno.dev
    options:
      name: tls-security-headers
      namespace: proxy
