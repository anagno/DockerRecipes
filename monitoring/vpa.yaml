apiVersion: "autoscaling.k8s.io/v1"
kind: VerticalPodAutoscaler
metadata:
  name: monitoring-grafana-vpa
  namespace: monitoring
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: monitoring-grafana
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
---
apiVersion: "autoscaling.k8s.io/v1"
kind: VerticalPodAutoscaler
metadata:
  name: monitoring-victoria-metrics-operator-vpa
  namespace: monitoring
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: monitoring-victoria-metrics-operator
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
---
apiVersion: "autoscaling.k8s.io/v1"
kind: VerticalPodAutoscaler
metadata:
  name: monitoring-kube-state-metrics-vpa
  namespace: monitoring
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: monitoring-kube-state-metrics
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
